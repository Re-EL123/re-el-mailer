<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Re-EL Mailer</title>
    <meta name="description" content="Business email. Built for Re-EL." />
    <meta name="theme-color" content="#21396A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101522" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <!-- iOS ignores the manifest and cannot render the SVG favicon, so it needs
         its own raster icon. Three sizes, because iOS picks per device. -->
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="css/app.css" />

    <!--
      Link previews. Scrapers that support Open Graph read these; the Twitter card
      tags are the same image for clients that only honour that namespace.
      og:url and og:image are absolute because the page is served from a Pages
      host and every scraper resolves relative URLs against the fetching
      document rather than the canonical URL.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Re-EL Mailer" />
    <meta property="og:title" content="Re-EL Mailer" />
    <meta property="og:description" content="Business email. Built for Re-EL." />
    <meta property="og:url" content="https://mailer.re-el.co.za/" />
    <meta property="og:image" content="https://mailer.re-el.co.za/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Re-EL Mailer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Re-EL Mailer" />
    <meta name="twitter:description" content="Business email. Built for Re-EL." />
    <meta name="twitter:image" content="https://mailer.re-el.co.za/assets/og-image.png" />
    <script>
      // API origin.
      //
      // Production runs the frontend on GitHub Pages (mailer.re-el.co.za) and the
      // API on Vercel (api.mail.re-el.co.za), so the default must be an absolute
      // cross-origin URL: a same-origin '/api' would resolve against the Pages
      // host, which has no functions and returns 404 for every call.
      //
      // Vercel mounts api/ under /api, so the path is part of the base. Omit it
      // and every request 404s — which the browser then reports as a CORS
      // error, not a routing mistake. api.js normalises the value anyway, so
      // the ?api= override below accepts either form.
      window.__REEL_CONFIG__ = {
        apiBase: 'https://api.mail.re-el.co.za/api',
      };
      // Same-origin proxy path: only when the page is served locally.
      if (['localhost', '127.0.0.1'].includes(location.hostname)) {
        window.__REEL_CONFIG__.apiBase = '/api';
        const override = new URLSearchParams(location.search).get('api');
        if (override) window.__REEL_CONFIG__.apiBase = override;
      }
    </script>
  </head>
  <body data-mode="public">
    <div id="root"></div>
    <noscript>Re-EL Mailer requires JavaScript.</noscript>
    <script type="module" src="js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js'));
      }
    </script>
  </body>
</html>
