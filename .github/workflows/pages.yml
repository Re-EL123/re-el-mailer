name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/pages.yml'
  # Lets a failed deployment be retried from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race for the Pages environment, and let a running
# one finish instead of leaving the site in a partially uploaded state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # apps/web is served as-is: no bundler, no build step, no dependencies.
      - name: Check static assets resolve
        run: node scripts/check.mjs

      # `enablement: true` lets the first deployment turn Pages on for the repo
      # instead of failing with "Get Pages site failed" on a freshly created one.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web

      - id: deployment
        uses: actions/deploy-pages@v4